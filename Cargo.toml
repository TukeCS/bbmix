[package]
name = "bbmix"
version = "0.1.0"
edition = "2024"
description = "A modern mixer for the RME Babyface Pro (FS) on Linux"
license = "MIT"

[dependencies]
alsa-sys = "0.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
